<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox · Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/inbox.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="3" width="16" height="3" rx="1.5"/><rect x="2" y="8.5" width="11" height="3" rx="1.5"/><rect x="2" y="14" width="6" height="3" rx="1.5"/></symbol>
</svg>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="brand"><svg aria-hidden="true"><use href="#mark"/></svg>Dispatch
      <button class="btn ghost menu-close" id="menu-close" type="button" aria-label="Close navigation">Close</button>
    </div>
    <a class="scope" href="#" aria-label="Line and shift">
      <strong id="scope-line">WhatsApp pasien</strong>
      <span id="scope-shift">Shift pagi</span>
    </a>
    <a class="nav-item" href="/" aria-current="page">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M2 9.5h3l1 2h4l1-2h3"/><path d="M3.5 3h9l1.5 6.5V13H2V9.5z"/></svg>
      Inbox<span class="count" id="nav-count" aria-label="messages that need action"></span>
    </a>
    <a class="nav-item" href="/docs">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 2h6l3 3v9H4z"/><path d="M10 2v3h3M6 8h5M6 11h5"/></svg>
      API
    </a>
    <div class="bottom">
      <dl class="facts" id="engine-facts" aria-label="Triage settings"></dl>
    </div>
  </aside>

  <header class="topbar">
    <button class="btn ghost menu-toggle" id="menu-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </button>
    <span class="brand-short"><svg aria-hidden="true"><use href="#mark"/></svg>Dispatch</span>
    <label class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <input id="search" type="search" placeholder="Search messages" aria-label="Search messages and senders">
      <kbd>/</kbd>
    </label>
  </header>

  <main class="sheet">
    <div class="title-row">
      <div>
        <h1>Inbox</h1>
        <p class="sub" id="finding"><span class="skeleton" style="width: 420px; height: 20px"></span></p>
      </div>
      <div class="title-actions">
        <span class="stamp" id="stamp"></span>
        <button class="btn" id="rerun" type="button">Triage again</button>
      </div>
    </div>

    <div class="inbox">
      <section class="list-column" aria-label="Messages">
        <div class="tabs" role="tablist" id="tabs"></div>
        <ul class="messages" id="messages"></ul>
      </section>

      <div class="right-stack">
        <section class="open-column" aria-label="Open message">
          <div id="open-message"></div>
          <form class="composer" id="composer">
            <h3><label for="composer-text">Test a message</label></h3>
            <textarea id="composer-text" maxlength="2000" placeholder="Paste a patient message in any language" required></textarea>
            <div class="assign-row">
              <button class="btn" type="submit">Triage and add to inbox</button>
              <span id="composer-status" role="status"></span>
            </div>
          </form>
        </section>
        <aside class="details-column" aria-label="Why the model decided this">
          <div class="well" id="why"></div>
        </aside>
      </div>
    </div>
  </main>
</div>
<script src="/static/inbox.js"></script>
</body>
</html>
