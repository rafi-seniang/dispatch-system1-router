[project]
name = "dispatch"
version = "0.4.0"
description = "Routes any paragraph into custom choices with a System One decision model (local Laya or hosted Jev)"
requires-python = ">=3.11"
# The pinned runtime set for Docker is requirements-app.txt

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "laya.*"]
ignore_missing_imports = true
